---
# ----------------------------------------------------------------------------
# TEMPLATE ONLY – plaintext placeholders.
# `make bootstrap` copies this to secrets.sops.yaml and encrypts it.
# Edit real values with:   make secrets   (opens sops in $EDITOR)
# ----------------------------------------------------------------------------

# --- OpenTofu -----------------------------------------------------------------
# Passphrase for OpenTofu native state encryption (min 16 chars).
tofu_state_passphrase: change-me-to-a-long-random-passphrase
# Created in Phase 1 (make pve-host prints it once). Format: user@realm!tokenid
pve_api_token_id: terraform@pve!homelab
pve_api_token_secret: 00000000-0000-0000-0000-000000000000


# --- Docker host: docker/ stack -------------------------------------------------
# Raw values, grouped by service: no .env quoting or "$$" escaping (the .env template
# quotes them). group_vars/docker_hosts/*.yml maps them to environment variables.
homelab_secrets:
  duckdns:
    token: your_duckdns_token # DNS updates + Traefik's ACME DNS challenge
  watchtower:
    notification_url: discord://your_token@channel
  beszel:
    agent_key: ssh-ed25519 your_beszel_hub_public_key
  tinyauth:
    users: # user:bcrypt-hash, e.g. from `htpasswd -nB user`
      - user:$2a$10$replace_with_tinyauth_bcrypt_hash
    google_client_id: your_google_client_id.apps.googleusercontent.com
    google_client_secret: your_google_client_secret
  traefik:
    dashboard_users: # htpasswd lines for the dashboard: htpasswd -nB admin
      - admin:$2y$05$replace_with_bcrypt_hash

# --- LXC apps ----------------------------------------------------------------
gotify_admin_password: change-me
