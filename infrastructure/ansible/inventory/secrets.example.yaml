---
# ----------------------------------------------------------------------------
# TEMPLATE ONLY – plaintext placeholders.
# `make bootstrap` copies this to secrets.sops.yaml and encrypts it.
# Edit real values with:   make secrets   (opens sops in $EDITOR)
# ----------------------------------------------------------------------------

# --- OpenTofu -----------------------------------------------------------------
# Passphrase for OpenTofu native state encryption (min 16 chars).
tofu_state_passphrase: change-me-to-a-long-random-passphrase
# Created in Phase 1 (make pve-host prints it once). Format: user@realm!tokenid
pve_api_token_id: terraform@pve!homelab
pve_api_token_secret: 00000000-0000-0000-0000-000000000000


# --- Docker host: docker/ stack ------------------------------------------
# Secret keys rendered into /root/homelab/.env (merged with homelab_env in
# group_vars/docker_hosts/main.yml). Write values exactly as they must appear
# in .env – e.g. bcrypt hashes need "$$" escaping for docker compose.
homelab_env_secrets:
  WATCHTOWER_NOTIFICATION_URL: "discord://your_token@channel"
  TOKEN: your_duckdns_token
  DUCKDNS_TOKEN: your_duckdns_token
  BESZEL_KEY: "'your_beszel_ssh_public_key'"
  TINYAUTH_AUTH_USERS: "user:$$2a$$10$$replace_with_tinyauth_bcrypt_hash"
  TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTID: your_google_client_id.apps.googleusercontent.com
  TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTSECRET: your_google_client_secret

# --- Docker host: Traefik ----------------------------------------------------
# htpasswd line(s) for the Traefik dashboard: htpasswd -nB admin
traefik_basic_auth_users:
  - "admin:$2y$05$replace_with_bcrypt_hash"

# --- LXC apps ----------------------------------------------------------------
gotify_admin_password: change-me
