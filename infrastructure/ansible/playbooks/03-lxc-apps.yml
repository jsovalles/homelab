---
# Phase 3 – applications inside the LXCs created by OpenTofu (via pct exec)
- name: LXC applications
  hosts: lxc_apps
  gather_facts: true
  tags: [lxc]
  pre_tasks:
    - name: Run preflight checks
      ansible.builtin.import_role:
        name: preflight
      tags: [always]

    - name: Ensure supported OS
      ansible.builtin.assert:
        that: ansible_distribution == 'Debian' and ansible_distribution_major_version | int >= 12
        fail_msg: "{{ inventory_hostname }}: expected Debian 12+, got {{ ansible_distribution }} {{ ansible_distribution_version }}"
        quiet: true
  roles:
    - role: base
      tags: [base]
    - role: auto_updates
      tags: [auto_updates]
  tasks:
    - name: Deploy {{ lxc_app }}
      ansible.builtin.include_role:
        name: "{{ lxc_app }}"
        apply:
          tags: ["{{ lxc_app }}"]
      tags: [gotify, myspeed]
