[defaults]
inventory = inventory/prod.yml
roles_path = roles
collections_path = .cache/collections:~/.ansible/collections
# Verify host keys; unknown hosts are trusted on first use only (accept-new)
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# Load *.sops.yaml files in group_vars/host_vars transparently (decrypted in memory only)
vars_plugins_enabled = host_group_vars,community.sops.sops

[community.sops]
vars_stage = inventory

# host_group_vars also reads *.sops.yaml (as raw ENC[...] strings). Run it in the same
# stage as the SOPS plugin, listed before it, so the decrypted values always win.
[vars_host_group_vars]
stage = inventory

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
