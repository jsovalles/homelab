---
# VM consoles: tty1 (noVNC) and ttyS0 (xterm.js). Containers keep Proxmox's `tty` console
# (login prompt, set by OpenTofu).
- name: Select console units
  ansible.builtin.set_fact:
    _console_access_units:
      - { unit: getty@tty1.service, args: "--noreset --noclear - ${TERM}" }
      - { unit: serial-getty@ttyS0.service, args: "--noreset --noclear --keep-baud 115200,57600,38400,9600 - ${TERM}" }

# Only our own drop-in is managed: the directories may hold overrides from packages or admins
- name: Getty drop-in directories (auto-login on)
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.unit }}.d"
    state: directory
    mode: "0755"
  loop: "{{ _console_access_units }}"
  loop_control:
    label: "{{ item.unit }}"
  when: console_access_autologin

- name: Remove the auto-login drop-in (auto-login off)
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.unit }}.d/autologin.conf"
    state: absent
  loop: "{{ _console_access_units }}"
  loop_control:
    label: "{{ item.unit }}"
  when: not console_access_autologin
  notify: Restart consoles

- name: Configure console auto-login for {{ console_access_autologin_user }}
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.unit }}.d/autologin.conf"
    mode: "0644"
    content: |
      # Managed by Ansible (role console_access)
      [Service]
      ExecStart=
      ExecStart=-/sbin/agetty --autologin {{ console_access_autologin_user }} {{ item.args }}
  loop: "{{ _console_access_units }}"
  loop_control:
    label: "{{ item.unit }}"
  when: console_access_autologin
  notify: Restart consoles
