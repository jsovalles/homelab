---
# First role of every play: the timezone also decides when the daily upgrades run
- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: base_packages | length > 0
