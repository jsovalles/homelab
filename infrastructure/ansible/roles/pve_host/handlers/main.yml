---
- name: Reload network
  ansible.builtin.command: ifreload -a
  changed_when: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Update initramfs
  ansible.builtin.command: update-initramfs -u -k all
  changed_when: true
