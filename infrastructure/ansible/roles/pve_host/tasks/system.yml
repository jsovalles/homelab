---
- name: Time sync (chrony)
  ansible.builtin.systemd_service:
    name: chrony
    enabled: true
    state: started

- name: Kernel settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-homelab.conf
    reload: true
  loop: "{{ pve_host_sysctl | dict2items }}"

# Root may log in over SSH with keys only (the keys are authorised by this role first).
# The web UI keeps using the root password.
- name: SSH – key-only root login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-homelab.conf
    mode: "0644"
    content: |
      # Managed by Ansible (role pve_host)
      PermitRootLogin {{ 'prohibit-password' if pve_host_ssh_keys_only else 'yes' }}
      PasswordAuthentication {{ 'no' if pve_host_ssh_keys_only else 'yes' }}
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

# Persisted for boot (root on ZFS: the module options are read from the initramfs) and applied
# to the running module right away
- name: ZFS ARC ceiling (boot)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/zfs.conf
    mode: "0644"
    content: |
      # Managed by Ansible (role pve_host, pve_host_zfs_arc_max_mib)
      options zfs zfs_arc_max={{ pve_host_zfs_arc_max_mib * 1048576 }}
  when: pve_host_zfs_arc_max_mib | int > 0
  notify: Update initramfs

- name: ZFS ARC ceiling (running system)
  ansible.builtin.shell:
    cmd: |
      f=/sys/module/zfs/parameters/zfs_arc_max
      [ -e "$f" ] || exit 0
      [ "$(cat "$f")" = "{{ pve_host_zfs_arc_max_mib * 1048576 }}" ] && exit 0
      echo {{ pve_host_zfs_arc_max_mib * 1048576 }} > "$f" && echo changed
  register: _pve_host_arc
  changed_when: "'changed' in _pve_host_arc.stdout"
  when: pve_host_zfs_arc_max_mib | int > 0
