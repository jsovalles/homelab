---
- name: Time sync (chrony)
  ansible.builtin.systemd_service:
    name: chrony
    enabled: true
    state: started

- name: Kernel settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-homelab.conf
    reload: true
  loop: "{{ pve_host_sysctl | dict2items }}"

# Root may log in over SSH with keys only (the keys are authorised by this role first).
# The web UI keeps using the root password.
- name: SSH – key-only root login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-homelab.conf
    mode: "0644"
    content: |
      # Managed by Ansible (role pve_host)
      PermitRootLogin {{ 'prohibit-password' if pve_host_ssh_keys_only else 'yes' }}
      PasswordAuthentication {{ 'no' if pve_host_ssh_keys_only else 'yes' }}
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
