---
# HA services only matter in a cluster. On a single node they just write state every few
# seconds, so they are stopped – and left alone as soon as the node joins a cluster.
- name: Check cluster membership
  ansible.builtin.command: pvecm status
  register: _pve_cluster
  changed_when: false
  failed_when: false
  check_mode: false

- name: Disable HA services on a single node
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: [pve-ha-lrm, pve-ha-crm]
  when: pve_host_disable_ha_single_node and _pve_cluster.rc != 0
