---
- name: Check whether a reboot is pending
  ansible.builtin.stat:
    path: /run/reboot-required
  register: _pve_reboot

- name: Reboot required
  ansible.builtin.debug:
    msg: >-
      A reboot is needed to activate {{ 'a new kernel/packages' if _pve_reboot.stat.exists else 'the new CPU microcode' }}.
      The host can't reboot itself during this run (Ansible runs on it) – reboot when convenient.
  when: _pve_reboot.stat.exists or (_pve_microcode_install is changed)
  changed_when: true
