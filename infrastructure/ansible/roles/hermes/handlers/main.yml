---
- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Restart hermes gateway
  ansible.builtin.systemd_service:
    name: hermes-gateway
    state: restarted
    daemon_reload: true
  when: hermes_gateway_enabled | bool and not (ansible_check_mode and _hermes_gateway_unit is changed)

- name: Restart hermes dashboard
  ansible.builtin.systemd_service:
    name: hermes-dashboard
    state: restarted
    daemon_reload: true
  when: hermes_dashboard_enabled | bool and not (ansible_check_mode and _hermes_dashboard_unit is changed)
