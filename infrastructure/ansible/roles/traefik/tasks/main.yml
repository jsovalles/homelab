---
- name: Check the service catalog
  ansible.builtin.assert:
    that: _problems | length == 0
    fail_msg: "Service catalog (group_vars/all/services.yml): {{ _problems | join('; ') }}"
    quiet: true
  vars:
    _problems: >-
      {%- set out = [] -%}
      {%- set kinds = ['container', 'guest', 'nodes', 'address', 'service'] -%}
      {%- for key in ['name', 'subdomain'] -%}
      {%- set values = traefik_services | map(attribute=key) | list -%}
      {%- for v in values | unique if values | select('equalto', v) | list | length > 1 -%}
      {%- set _ = out.append('duplicate ' ~ key ~ ' ' ~ v) -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- for s in traefik_services -%}
      {%- if kinds | select('in', s) | list | length != 1 -%}
      {%- set _ = out.append(s.name ~ ' needs exactly one of ' ~ kinds | join('/')) -%}
      {%- elif s.service is not defined and s.port is not defined -%}
      {%- set _ = out.append(s.name ~ ' has no port') -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

# container/guest/nodes/address -> backend URLs. Skipped: a guest this environment does not have,
# an address that rendered empty. The catalog order is kept.
- name: Resolve the catalog into routes for this environment
  ansible.builtin.set_fact:
    _traefik_routes: >-
      {%- set out = [] -%}
      {%- for s in traefik_services -%}
      {%- if s.container is defined -%}
      {%- set hosts = [s.container] -%}
      {%- elif s.guest is defined -%}
      {%- set hosts = [guest_ips[s.guest]] if s.guest in guest_ips else [] -%}
      {%- elif s.nodes | default(false) -%}
      {%- set hosts = node_ips.values() | list -%}
      {%- elif s.address is defined -%}
      {%- set hosts = [s.address] if s.address | length > 0 else [] -%}
      {%- else -%}
      {%- set hosts = [] -%}
      {%- endif -%}
      {%- set urls = [] -%}
      {%- for h in hosts -%}
      {%- set _ = urls.append(s.scheme | default('http') ~ '://' ~ h ~ ':' ~ s.port) -%}
      {%- endfor -%}
      {%- if s.service is defined or urls | length > 0 -%}
      {%- set _ = out.append(s | combine({'urls': urls})) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Routes skipped in this environment (target not present)
  ansible.builtin.debug:
    msg: "{{ traefik_services | map(attribute='name') | difference(_traefik_routes | map(attribute='name')) }}"
  when: traefik_services | length != _traefik_routes | length

- name: Ensure basic-auth users exist when the dashboard is routed
  ansible.builtin.assert:
    that: traefik_basic_auth_users | length > 0
    fail_msg: "traefik_basic_auth_users is empty – add an htpasswd line with `make secrets`."
    quiet: true
  when: _traefik_routes | selectattr('service', 'defined') | selectattr('service', 'equalto', 'api@internal') | list | length > 0
  no_log: true

- name: Ensure Traefik config directories exist
  ansible.builtin.file:
    path: "{{ traefik_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: [dynamic, acme]

- name: Render static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_dir }}/traefik.yml"
    mode: "0644"
  notify: Restart traefik

# Dynamic files are hot-reloaded by Traefik's file provider (watch: true)
- name: Render routes
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ traefik_dir }}/dynamic/{{ item }}"
    mode: "0644"
  loop: [config.yml, internal.yml]

- name: Remove dynamic files from earlier layouts
  ansible.builtin.file:
    path: "{{ traefik_dir }}/dynamic/{{ item }}"
    state: absent
  loop: "{{ traefik_legacy_dynamic_files }}"

- name: Render middlewares (contains the basic-auth hash)
  ansible.builtin.template:
    src: middleware.yaml.j2
    dest: "{{ traefik_dir }}/dynamic/middleware.yaml"
    mode: "0600"
  no_log: true

# Restart now (if traefik.yml changed) so the stack's health checks test the new config
- name: Apply pending Traefik restart
  ansible.builtin.meta: flush_handlers
