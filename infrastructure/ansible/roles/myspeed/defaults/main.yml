---
# Pinned release tag (Renovate bumps it); "latest" follows GitHub's newest release
# renovate: datasource=github-releases depName=gnmyt/myspeed
myspeed_version: v1.0.9
myspeed_dir: /opt/myspeed
# System user the service runs as (owns only data/ and bin/)
myspeed_user: myspeed
myspeed_node_major: 22
myspeed_port: 5216
# Speed-test provider: ookla | libre | cloudflare
myspeed_provider: libre
# none = the password is needed for everything; read = viewing works without it
myspeed_password_level: none
