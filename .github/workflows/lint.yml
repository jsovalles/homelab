name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: infrastructure/ansible/requirements.lock
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
      - run: pip install -r infrastructure/ansible/requirements.lock
      - run: ansible-galaxy collection install -r requirements.yml -p .cache/collections
        working-directory: infrastructure/ansible
      # CI has no age key: the ansible-lint hook loads group_vars without the SOPS plugin
      - run: pre-commit run --all-files --show-diff-on-failure

  opentofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
      - run: tofu init -backend=false && tofu validate
        working-directory: infrastructure/terraform
        env:
          TF_VAR_state_passphrase: ci-dummy-passphrase-not-used-0000

  # Whole-history secret scan (the pre-commit hook only sees staged changes)
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact

  # Single required status check for branch protection
  success:
    if: always()
    needs: [pre-commit, opentofu, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.pre-commit.result }}" = success ] && [ "${{ needs.opentofu.result }}" = success ] && [ "${{ needs.gitleaks.result }}" = success ]'
