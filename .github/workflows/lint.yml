name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: infrastructure/ansible/requirements.lock
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu
          tofu_version: 1.12.5
      - run: pip install -r infrastructure/ansible/requirements.lock
      - run: ansible-galaxy collection install -r requirements.yml -p .cache/collections
        working-directory: infrastructure/ansible
      # CI has no age key: the ansible-lint hook loads group_vars without the SOPS plugin
      - run: pre-commit run --all-files --show-diff-on-failure

  opentofu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu
          tofu_version: 1.12.5
      - run: tofu init -backend=false && tofu validate
        working-directory: infrastructure/terraform
        env:
          TF_VAR_state_passphrase: ci-dummy-passphrase-not-used-0000

  # Whole-history secret scan (the pre-commit hook only sees staged changes)
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact

  tflint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          tflint_version: v0.64.0
      - run: tflint --init && tflint --recursive --format compact
        working-directory: infrastructure/terraform

  # IaC misconfiguration scan (Terraform, GitHub Actions, Ansible) – settings in .checkov.yaml
  iac-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r .github/checkov-requirements.txt
      - run: checkov --config-file .checkov.yaml

  # .env is generated by Ansible on the VM; dummy values for every ${VAR:?} are enough to validate
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          grep -oE '\$\{[A-Z0-9_]+' docker-compose.yml | cut -c3- | sort -u | sed 's/$/=ci-dummy/' > .env
          docker compose config --quiet
        working-directory: docker

  # Single required status check for branch protection
  success:
    if: always()
    needs: [pre-commit, opentofu, gitleaks, tflint, iac-scan, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$ALL_OK" = true
        env:
          ALL_OK: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
