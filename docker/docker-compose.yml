services:

  traefik:
    image: traefik:v3.7.19@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
    container_name: traefik
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?} # ACME DNS challenge
      TZ: ${TZ:?}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yml:/traefik.yml:ro
      - ./config/traefik/dynamic:/dynamic:ro
      - ./config/traefik/acme:/acme
    network_mode: host

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.5.0@sha256:071f79a639e9361123a5e57733107320207b844ddbbd92dfa6962f541fe8aac8
    container_name: wg-easy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    environment:
      PORT: ${PORT}
      INSECURE: ${WG_EASY_INSECURE:-false}
      DISABLE_IPV6: "true"
    ports:
      - "${WG_PORT}:${WG_PORT}/udp"
    volumes:
      - ./config/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      dns:
        ipv4_address: 172.30.0.4

  adguardhome:
    image: adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
    container_name: adguardhome
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - TZ=${TZ}
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./config/adguardhome:/opt/adguardhome/conf
      - adguard_work:/opt/adguardhome/work
    networks:
      dns:
        ipv4_address: 172.30.0.3
    dns:
      - 172.30.0.2
      - 1.1.1.1
    depends_on:
      unbound:
        condition: service_healthy

  unbound:
    image: mvance/unbound:1.22.0@sha256:76906da36d1806f3387338f15dcf8b357c51ce6897fb6450d6ce010460927e90
    container_name: unbound
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    # ports:
    #   - "5335:53/udp" #testing unbound only
    volumes:
      - ./unbound/forward-records.conf:/opt/unbound/etc/unbound/forward-records.conf
      - unbound_data:/opt/unbound/etc/unbound
    networks:
      dns:
        ipv4_address: 172.30.0.2

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest@sha256:97563419e4edfbec21249efe8b2deb93e867ea04568f7bfb057254f49881a79b
    container_name: duckdns
    network_mode: host
    environment:
      SUBDOMAINS: ${SUBDOMAINS:?}
      TOKEN: ${DUCKDNS_TOKEN:?}
      TZ: ${TZ:?}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m

  beszel:
    image: henrygd/beszel:0.21.2@sha256:b0be90bd4aee2993fde763032a5098ce4386fba43cfe5031ec017b8d9e8c97a2
    container_name: beszel
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "127.0.0.1:8090:8090" # reached via Traefik (host network) only
    volumes:
      - beszel_data:/beszel_data

  beszel-agent:
    image: henrygd/beszel-agent:0.21.2@sha256:343254226ae57a5cc6f8c23c755b1464730aba2abc7043116a2e222711ec6e1a
    container_name: beszel-agent
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    network_mode: host
    environment:
      LISTEN: 45876
      HUB_URL: ${BESZEL_HUB_URL:?}
      KEY: ${BESZEL_KEY:?}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  bentopdf:
    image: ghcr.io/alam00000/bentopdf:2.8.11@sha256:b107c37d9f1f27b7edae28d262e526d8e225541a7cc26005b84dbab42c904105
    container_name: bentopdf
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      dns:
        ipv4_address: 172.30.0.8

  tinyauth:
    image: ghcr.io/steveiliop56/tinyauth:v5.0.7@sha256:0793c71c49906e079d90c7e693cded9df569217a92d717dc9b171f2116fcd1c6
    container_name: tinyauth
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    environment:
      TINYAUTH_APPURL: ${TINYAUTH_APPURL:?}
      TINYAUTH_AUTH_SECURECOOKIE: ${TINYAUTH_AUTH_SECURECOOKIE:?}
      TINYAUTH_AUTH_USERS: ${TINYAUTH_AUTH_USERS:?}
      TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTID: ${TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTID:?}
      TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTSECRET: ${TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTSECRET:?}
      TZ: ${TZ:?}
    networks:
      dns:
        ipv4_address: 172.30.0.7
    volumes:
      - tinyauth_data:/data

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.11@sha256:7554dba313c84e44fee921ef3b5626ba1c711e412e82815e8c957517026112a9
    container_name: uptime-kuma
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      dns:
        ipv4_address: 172.30.0.11

  myspeed:
    image: germannewsmaker/myspeed:1.0.9@sha256:3a3e774b3f78d930a5a962d625b99bcb3d71730bfeb4a6b93e04fd38cfe7d9a9
    container_name: myspeed
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    environment:
      TZ: ${TZ:?}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5216/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/myspeed:/myspeed/data
    networks:
      dns:
        ipv4_address: 172.30.0.9

volumes:
  adguard_work:
  unbound_data:
  beszel_data:
  tinyauth_data:
  uptime_kuma_data:
networks:
  dns:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/24
